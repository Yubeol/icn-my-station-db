name: Dashboard CD

on:
  workflow_run:
    workflows:
      - Dashboard CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified dashboard
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SHA CI_RUN_ID AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY DEPLOY_BUCKET EC2_INSTANCE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Required production environment variable is missing: ${name}" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]

      - name: Reject stale main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" != "$DEPLOY_SHA" ]; then
            echo "Refusing stale deployment: CI=${DEPLOY_SHA}, main=${latest_sha}" >&2
            exit 1
          fi

      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ env.DEPLOY_SHA }}
          path: release/frontend
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Validate and package frontend artifact
        run: |
          set -euo pipefail
          test -s release/frontend/index.html
          tar -C release/frontend -czf "frontend-${DEPLOY_SHA}.tar.gz" .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-dashboard-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=dashboard-backend
          cache-to: type=gha,mode=max,scope=dashboard-backend

      - name: Upload frontend release to S3
        env:
          FRONTEND_ARCHIVE: frontend-${{ env.DEPLOY_SHA }}.tar.gz
        run: |
          set -euo pipefail
          aws s3 cp "$FRONTEND_ARCHIVE" \
            "s3://${DEPLOY_BUCKET}/dashboard/releases/${DEPLOY_SHA}/frontend.tar.gz" \
            --only-show-errors

      - name: Recheck main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" != "$DEPLOY_SHA" ]; then
            echo "A newer main commit exists; uploaded artifacts will not be deployed." >&2
            exit 1
          fi

      - name: Deploy through AWS Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"
          frontend_uri="s3://${DEPLOY_BUCKET}/dashboard/releases/${DEPLOY_SHA}/frontend.tar.gz"
          remote_command="sudo /usr/local/sbin/icn-deploy '${DEPLOY_SHA}' '${image_uri}' '${frontend_uri}'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ICN dashboard ${DEPLOY_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "Deployment completed for ${DEPLOY_SHA}."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM deployment failed with status: ${status}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for the SSM deployment command." >&2
          exit 1
